<div id="div-form">
  <h2>Inscrição na Corrida</h2>

  <form id="form-inscricao" (ngSubmit)="finalizarInscricao()">
    <div class="grupo-campo">
      <label for="atleta-cadastrado">Atleta Cadastrado</label>
      <select name="atleta-cadastrado" id="atleta-cadastrado" [(ngModel)]="atletaCadastrado">
        <option value="">Selecione o atleta (ou digite o CPF)</option>
        <option *ngFor="let atleta of atletas" [value]="atleta.cpf">
          {{ atleta.nome }} - {{ atleta.cpf }}
        </option>
      </select>
    </div>

    <div class="grupo-campo">
      <label for="cpf">Ou Buscar por CPF</label>
      <input
        type="text"
        id="cpf"
        placeholder="000.000.000-00"
        [(ngModel)]="cpfBusca"
        name="cpf"
        (blur)="buscarPorCpf()"
      />
    </div>

    <div class="grupo-campo">
      <label for="corrida-escolhida">Corrida Escolhida</label>
      <select name="corrida-escolhida" id="corrida-escolhida" [(ngModel)]="corridaEscolhida">
        <option value="">Selecione a corrida</option>
        <option *ngFor="let corrida of corridas" [value]="corrida">
          {{ corrida }}
        </option>
      </select>
    </div>

    <div class="grupo-campo">
      <label>Distância da Prova</label>
      <div id="div-radio">
        <label>
          <input type="radio" name="distancia" value="5km" [(ngModel)]="distanciaProva" /> 5km
        </label>
        <label>
          <input type="radio" name="distancia" value="10km" [(ngModel)]="distanciaProva" /> 10km
        </label>
        <label>
          <input type="radio" name="distancia" value="25km" [(ngModel)]="distanciaProva" /> 25km
        </label>
      </div>
    </div>

    <div class="grupo-campo">
      <label for="camisa">Tamanho da Camiseta (Kit)</label>
      <select name="camisa" id="camisa" [(ngModel)]="kitTamanho">
        <option value="">Selecione</option>
        <option *ngFor="let tamanho of tamanhosCamiseta" [value]="tamanho">
          {{ tamanho }}
        </option>
      </select>
    </div>

    <div class="grupo-campo">
      <label for="categoria">Categoria / Faixa Etária</label>
      <input type="text" name="categoria" id="categoria" [(ngModel)]="categoriaFaixaEtaria" />
    </div>

    <div id="valor-inscricao">
      <h3>Valor da Inscrição:</h3>
      <span class="preco">R$ {{ valorInscricao.toFixed(2).replace('.', ',') }}</span>
    </div>

    <label class="termos">
      <input type="checkbox" name="termos" required [(ngModel)]="termosServicos" />
      Li e aceito os termos do regulamento da prova e declaração de saúde.
    </label>

    <p *ngIf="mensagemErro" class="mensagem-erro">{{ mensagemErro }}</p>

    <div id="div-btn">
      <button type="submit" id="bnt-finalizar" [disabled]="enviando">
        Finalizar e Ir para Pagamento
      </button>
    </div>
  </form>
</div>
