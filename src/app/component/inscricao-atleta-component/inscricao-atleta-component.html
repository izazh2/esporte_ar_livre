<div id="div-form">
    <h2>Inscrição na Corrida</h2>
  
    <form id="form-inscricao">
      <div class="grupo-campo">
        <label for="atleta-cadastrado">Atleta Cadastrado</label>
        <select name="atleta-cadastrado" id="atleta-cadastrado">
          <option value="">Selecione o atleta (ou digite o CPF)</option>
        </select>
      </div>
  
      <div class="grupo-campo">
        <label for="cpf">Ou Buscar por CPF</label>
        <input type="text" id="cpf" placeholder="000.000.000-00">
      </div>
  
      <div class="grupo-campo">
        <label for="corrida-escolhida">Corrida Escolhida</label>
        <select name="corrida-escolhida" id="corrida-escolhida">
          <option value="">Circuito das Estações - Etapa Verão (15/11/2026)</option>
        </select>
      </div>
  
      <div class="grupo-campo">
        <label>Distância da Prova</label>
        <div id="div-radio">
          <label><input type="radio" name="distancia" value="5km"> 5km</label>
          <label><input type="radio" name="distancia" value="10km"> 10km</label>
          <label><input type="radio" name="distancia" value="25km"> 25km</label>
        </div>
      </div>
  
      <div class="grupo-campo">
        <label for="camisa">Tamanho da Camiseta (Kit)</label>
        <select name="camisa" id="camisa">
          <option value="">Selecione</option>
        </select>
      </div>
  
      <div class="grupo-campo">
        <label for="categoria">Categoria / Faixa Etária</label>
        <input type="text" name="categoria" id="categoria">
      </div>
  
      <div id="valor-inscricao">
        <h3>Valor da Inscrição:</h3>
        <span class="preco">R$ 89,90</span>
      </div>
  
      <label class="termos">
        <input type="checkbox" required>
        Li e aceito os termos do regulamento da prova e declaração de saúde.
      </label>
  
      <div id="div-btn">
        <button type="submit" id="bnt-finalizar">Finalizar e Ir para Pagamento</button>
      </div>
    </form>
  </div>
